;1" calcMode="linear" path="M900 204 L782.4 326.6"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.8s" begin="0.50s" repeatCount="indefinite"/></circle><circle r="3.4" fill="#c79cff" filter="url(#brilloSuave)"><animateMotion dur="2.8s" begin="1.90s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear" path="M900 204 L782.4 326.6"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.8s" begin="1.90s" repeatCount="indefinite"/></circle><g filter="url(#sombra)"><rect x="900" y="92" width="322" height="112" rx="20" fill="#09090b" fill-opacity="0.55"/></g><rect x="900" y="92" width="322" height="112" rx="20" fill="rgba(255,255,255,0.045)" stroke="url(#vidrioBorde)"/><rect x="920" y="114" width="46" height="46" rx="13" fill="#8C27F1" fill-opacity="0.2" stroke="#c79cff" stroke-opacity="0.45"/><g transform="translate(931 125) scale(1.0000)" fill="none" stroke="#ff9101" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"><path d="M12 2.8l1.9 5.3 5.3 1.9-5.3 1.9L12 17.2l-1.9-5.3L4.8 10l5.3-1.9z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></g><text x="984" y="138" class="tt">Habilidades</text><text x="984" y="164" class="d1">Cómo hace cada trabajo.</text><text x="984" y="184" class="d2">Skills que puedes leer y editar.</text><path d="M640 498 L740.8 373.7" stroke="#c79cff" stroke-opacity="0.55" stroke-width="1.4" fill="none" stroke-dasharray="2 6" class="flujo"/><circle r="3.4" fill="#ff9101" filter="url(#brilloSuave)"><animateMotion dur="2.8s" begin="1.00s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear" path="M640 498 L740.8 373.7"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.8s" begin="1.00s" repeatCount="indefinite"/></circle><circle r="3.4" fill="#c79cff" filter="url(#brilloSuave)"><animateMotion dur="2.8s" begin="2.40s" repeatCount="indefinite" ke