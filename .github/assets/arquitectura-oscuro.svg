090b" fill-opacity="0.55"/></g><rect x="900" y="498" width="322" height="112" rx="20" fill="rgba(255,255,255,0.045)" stroke="url(#vidrioBorde)"/><rect x="920" y="520" width="46" height="46" rx="13" fill="#8C27F1" fill-opacity="0.2" stroke="#c79cff" stroke-opacity="0.45"/><g transform="translate(931 531) scale(1.0000)" fill="none" stroke="#ff9101" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"><path d="M5 3.5l13 6.2-5.6 1.7-1.7 5.6z"/><path d="M12.4 11.4l6.1 6.1"/></g><text x="984" y="544" class="tt">Manos</text><text x="984" y="570" class="d1">Actúa en tu computadora y la web.</text><text x="984" y="590" class="d2">Pide permiso para lo irreversible.</text>
