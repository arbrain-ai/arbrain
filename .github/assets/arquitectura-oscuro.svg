<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" role="img" aria-labelledby="titulo desc">
<title id="titulo">Arquitectura de Arbrain</title>
<desc id="desc">El modelo al centro; a su alrededor memoria, habilidades, rutinas y manos; todo dentro de tu computadora o tu servidor. Entras por el panel, la voz o Claude Code.</desc>
<defs>
  <filter id="brillo" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="brilloSuave" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/></filter>
  <linearGradient id="vidrioBorde" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,255,255,0.22)"/><stop offset="0.35" stop-color="rgba(255,255,255,0.12)"/><stop offset="1" stop-color="rgba(255,255,255,0.12)" stop-opacity="0.5"/></linearGradient>
  <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0d12"/><stop offset="1" stop-color="#09090b"/></linearGradient>
  <radialGradient id="bloom" cx="760" cy="350" r="380" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8C27F1" stop-opacity="0.3"/><stop offset="1" stop-color="#8C27F1" stop-opacity="0"/></radialGradient>
  <radialGradient id="sol" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#ffd59a"/><stop offset="0.45" stop-color="#ff9101"/><stop offset="1" stop-color="#b35f00"/></radialGradient>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0.55" stop-color="#ff9101" stop-opacity="0.35"/><stop offset="1" stop-color="#ff9101" stop-opacity="0"/></radialGradient>
  <clipPath id="tarjeta"><rect width="1280" height="700" rx="28"/></clipPath>
</defs>
<style>
.tt{font:700 20px Inter,'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#f7f8f8;letter-spacing:-0.3px}
.d1{font:500 14px Inter,'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#d4d4d8}
.d2{font:500 13px Inter,'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#a1a1aa}
.pill{font:600 15px Inter,'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#f7f8f8}
.mono{font:600 11.5px 'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;letter-spacing:2.2px;fill:#a1a1aa}
.flujo{animation:flujo 1.6s linear infinite}
@keyframes flujo{to{stroke-dashoffset:-16}}
.orbita{transform-origin:760px 350px;animation:gira 40s linear infinite}
.orbita2{transform-origin:760px 350px;animation:gira 26s linear infinite reverse}
@keyframes gira{to{transform:rotate(360deg)}}
.halo{transform-origin:760px 350px;animation:halo 3.6s ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(.92);opacity:.6}50%{transform:scale(1.12);opacity:1}}
.borde{animation:borde 30s linear infinite}
@keyframes borde{to{stroke-dashoffset:-400}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
