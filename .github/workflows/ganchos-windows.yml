# Ganchos del cerebro en Windows (27 oct 2026). Fuente: arbrain/empaquetado/ci/workflows/ganchos-windows.yml del repo
# fuente; el generador lo copia a .github/workflows/ de la copia del alumno. En la copia no se edita: se regenera.
#
# Origen: un fundador en Windows (v0.2.9) no guardaba conversaciones porque capture-conversation.py importaba fcntl y,
# detrás, ZoneInfo necesitaba tzdata. Aquí el gancho corre de verdad como lo corre Claude Code en Windows: por
# `sh .claude/hooks/py.sh` en Git Bash, con un Python de python.org (sin tzdata), en la copia del alumno
# (arbrain/EDICION = cliente). Comprueba que deja .claude/daily con los acentos bien, que dos capturas a la vez no se
# pisan (msvcrt.locking) y que el chat de la app (CLAUDECLAW_DAEMON) también se guarda.
# Desde el 29 oct, además: cada gancho de .claude/settings.json corre con su comando exacto y una entrada mínima
# (ci/smoke/ganchos_settings.py), también con ARBRAIN_TZ y sin base de zonas; lo que el alumno corre a mano sin py.sh
# (selftest del recuerdo, ritual, presupuesto de memoria) y las pruebas de las skills con Python. Minutos: dos.
name: Arbrain · ganchos en Windows

on:
  workflow_dispatch:
  push:
    branches: ['ci-**', 'release/**']
    paths:
      - '.claude/hooks/**'
      - '.claude/settings.json'
      - '.claude/skills/goal-compiler/**'
      - '.claude/skills/os-audit/**'
      - '.claude/skills/bajar-a-tierra/**'
      - '.claude/skills/skill-creator/**'
      - '.claude/skills/habit-system/scripts/**'
      - 'arbrain/EDICION'
      - 'arbrain/cerebro/sembrar.py'
      - 'arbrain/cerebro/semilla/**'
      - 'arbrain/empaquetado/ci/smoke/ganchos_settings.py'
      - '.github/workflows/ganchos-windows.yml'

permissions:
  contents: read

concurrency:
  group: ganchos-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  captura:
    name: captura de conversaciones · windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: El terreno es el de un alumno en Windows
        shell: bash
        run: |
          grep -qx cliente <(grep -v '^#' arbrain/EDICION | sed '/^\s*$/d')
          python - <<'PY'
          import importlib.util, sys
          from zoneinfo import ZoneInfo
          print('python', sys.version.split()[0], 'fcntl:', importlib.util.find_spec('fcntl') is not None)
          assert importlib.util.find_spec('fcntl') is None, 'este runner trae fcntl: la prueba no serviría'
          try:
              ZoneInfo('America/Mexico_City'); print('zonas: hay base')
          except Exception as e:
              print('zonas: sin base (como el Python de un alumno):', type(e).__name__)
          PY

      - name: Pruebas unitarias de los ganchos (las que viajan en la copia)
        shell: bash
        run: |
          # Todas las de .claude/hooks/tests: captura sin fcntl, cada gancho sin fcntl ni base de zonas
          # (test_ganchos_sin_fcntl), zona del equipo en cliente, ritual y rutas por intención.
          python -m unittest discover -v -s .claude/hooks/tests

      - name: Punta a punta por py.sh (como Claude Code en Windows)
        shell: bash
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          raiz=$(pwd -W 2>/dev/null || pwd)
          t="$RUNNER_TEMP/sesion.jsonl"
          python - "$t" <<'PY'
          import json, sys
          lineas = [
            {'type': 'user', 'uuid': 'u1', 'timestamp': '2026-10-27T10:00:00Z',
             'message': {'role': 'user', 'content': [{'type': 'text', 'text': '¿Qué hago hoy? Revisión de cotización, señal ñandú'}]}},
            {'type': 'assistant', 'uuid': 'a1', 'timestamp': '2026-10-27T10:00:05Z',
             'message': {'role': 'assistant', 'content': [{'type': 'text', 'text': 'Hoy: llamar a tu cliente, año fiscal y acentos áéíóú'}]}},
          ]
          with open(sys.argv[1], 'w', encoding='utf-8', newline='\n') as f:
              for l in lineas: f.write(json.dumps(l, ensure_ascii=False) + '\n')
          PY
          entrada() { printf '{"session_id":"%s","transcript_path":%s,"cwd":%s}' "$1" \
            "$(python -c 'import json,sys;print(json.dumps(sys.argv[1]))' "$(cygpath -w "$t")")" \
            "$(python -c 'import json,sys;print(json.dumps(sys.argv[1]))' "$raiz")"; }

          # 1. Una captura normal (PreCompact / SessionEnd).
          entrada sesion-ci | sh .claude/hooks/py.sh capture-conversation --runtime claude
          # 2. Dos a la vez sobre la misma sesión: el candado de msvcrt no deja que se pisen.
          for i in 1 2 3 4; do entrada sesion-ci | sh .claude/hooks/py.sh capture-conversation --runtime claude & done; wait
          # 3. El chat de la app de Arbrain (el daemon pone CLAUDECLAW_DAEMON): en la edición cliente también se guarda.
          entrada sesion-app | CLAUDECLAW_DAEMON=1 sh .claude/hooks/py.sh capture-conversation --runtime claude
          # 4. Una rutina (CLAUDECLAW_SOURCE=cron) no es conversación: no se guarda.
          entrada sesion-cron | CLAUDECLAW_DAEMON=1 CLAUDECLAW_SOURCE=cron sh .claude/hooks/py.sh capture-conversation --runtime claude

          python - <<'PY'
          import glob, hashlib, json
          def sid(s): return hashlib.sha256(s.encode()).hexdigest()[:20]
          for sesion, esperado in [('sesion-ci', 1), ('sesion-app', 1), ('sesion-cron', 0)]:
              diarios = glob.glob(f'.claude/daily/*.claude-{sid(sesion)}.md')
              print(sesion, '->', diarios)  # ASCII: la consola de Windows es cp1252
              assert len(diarios) == esperado, (sesion, diarios)
              if not esperado: continue
              texto = open(diarios[0], encoding='utf-8').read()
              assert 'señal ñandú' in texto and 'áéíóú' in texto, texto
              assert texto.count('### ') == 2, f'mensajes duplicados o perdidos: {texto.count("### ")}'
              registro = glob.glob(f'arbrain/server/store/conversation-capture/*.claude.{sid(sesion)}.json')
              assert len(registro) == 1 and len(json.load(open(registro[0], encoding='utf-8'))['messages']) == 2, registro
          print('SMOKE ganchos-windows: OK (captura, concurrencia, chat de la app, rutina fuera, UTF-8)')
          PY

      - name: Sembrar el cerebro del alumno (como la instalación)
        shell: bash
        run: python arbrain/cerebro/sembrar.py

      - name: Cada gancho del settings.json, con entrada mínima, sin traceback
        shell: bash
        run: |
          set -euo pipefail
          # El comando exacto de settings.json por `bash -c` (Git Bash, como Claude Code en Windows), con la entrada
          # JSON de su evento y con `{}`: falla con un traceback o un código distinto de 0 y 2.
          python arbrain/empaquetado/ci/smoke/ganchos_settings.py
          # Un alumno fuera de México que fija su zona, en un Python sin base de zonas: tampoco truena.
          ARBRAIN_TZ=Europe/Madrid python arbrain/empaquetado/ci/smoke/ganchos_settings.py

      - name: Lo que el alumno corre a mano en Windows (sin py.sh ni UTF-8 forzado)
        shell: bash
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          revisa() { local out; out=$("$@" 2>&1) || { echo "$out"; echo "FALLO: $*"; exit 1; }
            if grep -q Traceback <<<"$out"; then echo "$out"; echo "TRACEBACK: $*"; exit 1; fi; echo "ok: $*"; }
          # La consola de un paso de Actions es un tubo con cp1252: lo mismo que truena en la PC del alumno.
          revisa python .claude/hooks/memory-recall.py --selftest
          revisa env ARBRAIN_TZ=Europe/Madrid python .claude/hooks/agenda-context.py --ritual-hecho
          revisa python .claude/hooks/agenda-context.py
          revisa sh .claude/hooks/py.sh agenda-context --ritual-hecho
          revisa sh .claude/hooks/memory-budget.sh
          revisa python .claude/skills/os-audit/scripts/os_audit.py --help
          revisa python .claude/skills/goal-compiler/scripts/grafo2plan.py --help

      - name: Pruebas de las skills con scripts de Python
        shell: bash
        run: |
          set -euo pipefail
          # `discover -s`: una ruta con `.claude/` no sirve de nombre de módulo para `python -m unittest <archivo>`.
          python -m unittest discover -v -s .claude/skills/goal-compiler/scripts -p 'test_*.py'
          python -m unittest discover -v -s .claude/skills/bajar-a-tierra/tests
          python -m unittest discover -v -s .claude/skills/skill-creator/tests
