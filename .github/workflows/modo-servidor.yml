# Modo servidor de Arbrain (edición del alumno) en Windows, Linux y macOS (21 oct 2026).
# Fuente: arbrain/empaquetado/ci/workflows/modo-servidor.yml del repo fuente; el generador lo copia a
# .github/workflows/ de la copia del alumno. En la copia no se edita: se regenera.
#
# Clona la copia, usa Node 22 y corre `npm run servidor` de verdad (instala, compila web y daemon, arranca) con
# --sin-navegador y un puerto libre; espera a que la web (/api/version) y el daemon (/health) respondan y hace
# `npm run servidor -- detener`. Lo orquesta arbrain/scripts/servidor/prueba-ci.mjs. Si falla, sube los logs.
# No usa secretos ni llaves: el daemon arranca sin llaves de modelo.
name: Arbrain · modo servidor

on:
  workflow_dispatch:
  push:
    branches: ['ci-**', 'release/**']
    paths:
      - 'arbrain/scripts/servidor.mjs'
      - 'arbrain/scripts/servidor/**'
      - 'arbrain/server/**'
      - 'arbrain/src/**'
      - 'arbrain/package.json'
      - 'arbrain/package-lock.json'
      - 'arbrain/next.config.ts'
      - '.github/workflows/modo-servidor.yml'

permissions:
  contents: read

concurrency:
  group: modo-servidor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  servidor:
    name: servidor · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            arbrain/package-lock.json
            arbrain/server/package-lock.json

      - name: La copia trae el modo servidor
        shell: bash
        run: |
          test -f arbrain/EDICION
          test -f arbrain/scripts/servidor.mjs
          test -f arbrain/scripts/servidor/prueba-ci.mjs
          node -e "const p=require('./arbrain/package.json'); if(!p.scripts||!p.scripts.servidor){console.error('falta npm run servidor');process.exit(1)}"

      # v0.2.7: Claude Code recién instalado con el instalador oficial y SIN refrescar el PATH de los pasos siguientes
      # (lo que vive quien lo instala con Arbrain ya corriendo). prueba-ci.mjs exige que Arbrain lo encuentre igual.
      - name: Instalar Claude Code (Windows, sin tocar el PATH)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          if (Test-Path "$env:USERPROFILE\.local\bin\claude.exe") { "ARBRAIN_CI_CLAUDE=instalado" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
      - name: Instalar Claude Code (macOS y Linux, sin tocar el PATH)
        if: runner.os != 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          if [ -x "$HOME/.local/bin/claude" ]; then echo "ARBRAIN_CI_CLAUDE=instalado" >> "$GITHUB_ENV"; fi

      - name: Arrancar, esperar salud y detener
        working-directory: arbrain
        run: node scripts/servidor/prueba-ci.mjs --datos "${{ runner.temp }}/arbrain-datos" --plazo-min 35

      - name: Logs del modo servidor
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-modo-servidor-${{ matrix.os }}
          path: ${{ runner.temp }}/arbrain-datos/logs
          if-no-files-found: warn
          retention-days: 7

  # v0.2.7 (encargo de Daniel, 22 oct): el caso de la prueba en Windows. Arbrain ya corre y DESPUÉS se instala Claude Code
  # como `claude.cmd` de npm en una carpeta con espacios, agregada solo al PATH del registro del usuario (el proceso de
  # Arbrain no la hereda). /api/llaves/suscripcion tiene que encontrarlo igual (prueba-ci.mjs › recorridoSesion).
  claude-despues-windows:
    name: servidor · windows · Claude Code después y ruta con espacios
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Arrancar, instalar Claude Code después (ruta con espacios) y comprobar que lo detecta
        working-directory: arbrain
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'instalar-despues.ps1'
          @'
          $dir = 'C:\Herramientas Arbrain\npm global'
          New-Item -ItemType Directory -Force $dir | Out-Null
          npm install -g --prefix "$dir" @anthropic-ai/claude-code --no-audit --no-fund
          if (-not (Test-Path (Join-Path $dir 'claude.cmd'))) { throw 'no quedó claude.cmd' }
          $p = [Environment]::GetEnvironmentVariable('Path', 'User')
          [Environment]::SetEnvironmentVariable('Path', ($p.TrimEnd(';') + ';' + $dir).TrimStart(';'), 'User')
          '@ | Set-Content -Encoding utf8 $script
          if (Get-Command claude -ErrorAction SilentlyContinue) { throw 'el runner ya trae claude; la prueba no serviría' }
          $env:ARBRAIN_CI_INSTALAR_DESPUES = "pwsh -NoProfile -ExecutionPolicy Bypass -File `"$script`""
          node scripts/servidor/prueba-ci.mjs --datos "$env:RUNNER_TEMP\arbrain-datos" --plazo-min 35
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-claude-despues-windows
          path: ${{ runner.temp }}/arbrain-datos/logs
          if-no-files-found: warn
          retention-days: 7
