<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizarrón</title>
<!-- El escenario del pizarrón (7 oct 2026). Corre aislado (sandbox allow-scripts, sin mismo origen): el código que
     fabrica Levy vive aquí y nunca toca la sesión de Arbrain. Lo dirige la vista del panel por postMessage
     (arbrain/src/features/pizarron/). Sin datos propios: todo llega del padre. -->
<link rel="stylesheet" href="./escenario.css">
</head>
<body data-luz="papel">
<div id="vista">
  <div id="grano"></div>
  <div id="mundo">
    <div id="capa-elementos"></div>
    <svg id="capa-hilos" class="capa-svg" aria-hidden="true"></svg>
    <svg id="capa-tinta" class="capa-svg" aria-hidden="true"></svg>
    <svg id="capa-lapiz" class="capa-svg" aria-hidden="true"></svg>
    <div id="capa-notas"></div>
  </div>
  <div id="velo"></div>
  <div id="pregunta" hidden></div>
  <div id="halo" aria-hidden="true"><svg width="24" height="28" viewBox="0 0 48 56"><defs>
    <path id="f0" d="M8 6 L13 45 L21 32 L40 28 Z"/>
    <linearGradient id="pa" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4CCFF"/><stop offset=".45" stop-color="#A35BFF"/><stop offset="1" stop-color="#5B12B8"/></linearGradient>
    <linearGradient id="pb" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B1FE0"/><stop offset="1" stop-color="#2E0866"/></linearGradient>
    <filter id="shg" x="-90%" y="-90%" width="280%" height="280%"><feDropShadow dx="2" dy="5" stdDeviation="3" flood-color="#2a0060" flood-opacity=".45"/><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#A35BFF" flood-opacity=".7"/></filter>
  </defs><g filter="url(#shg)"><g class="cuerpo">
    <use href="#f0" fill="url(#pb)" stroke="url(#pb)" stroke-width="2.4" stroke-linejoin="round" transform="translate(1.5,1.5)"/>
    <use href="#f0" fill="url(#pa)" stroke="url(#pa)" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M8 6 L13 45 L21 32 Z" fill="#fff" opacity=".3"/><path d="M8 6 L40 28 L21 32 Z" fill="#2a0866" opacity=".2"/>
    <circle cx="8" cy="6" r="1.6" fill="#fff" opacity=".95"/>
  </g></g></svg><i class="onda"></i></div>
  <div id="subtitulo" aria-live="polite"></div>
  <div id="aviso" hidden></div>
</div>
<script src="./escenario.js"></script>
</body>
</html>
