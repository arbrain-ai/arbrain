<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Arbrain</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #0a0a0f; color: #fafafa;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; overflow: hidden;
  }
  .wrap { text-align: center; }
  .logo {
    width: 84px; height: 84px; border-radius: 22px;
    box-shadow: 0 0 42px rgba(140, 39, 241, 0.35);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 42px rgba(140, 39, 241, 0.35); }
    50% { transform: scale(1.04); box-shadow: 0 0 58px rgba(140, 39, 241, 0.55); }
  }
  h1 { margin: 18px 0 4px; font-size: 19px; font-weight: 700; letter-spacing: 0.02em; }
  p { margin: 0; font-size: 12px; color: #9f9fa8; }
  .bar {
    margin: 20px auto 0; width: 160px; height: 3px; border-radius: 3px;
    background: rgba(255,255,255,0.08); overflow: hidden; position: relative;
  }
  .bar::after {
    content: ''; position: absolute; inset: 0; width: 40%;
    border-radius: 3px; background: #8c27f1;
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
  #error { display: none; margin: 18px auto 0; max-width: 340px; text-align: left; user-select: text; -webkit-user-select: text; }
  #error .t { font-size: 14px; font-weight: 600; color: #fafafa; margin: 0 0 6px; }
  #error .h { font-size: 12.5px; color: #c4c4cc; line-height: 1.5; margin: 0; }
  #error details { margin-top: 10px; font-size: 11px; color: #9f9fa8; }
  #error summary { cursor: pointer; color: #b9a3f5; }
  #error pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; padding: 8px; border-radius: 8px; background: rgba(255,255,255,0.05); font: 11px/1.45 ui-monospace, Menlo, monospace; color: #d4d4d8; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="icon-192.png" alt="Arbrain" />
    <h1>Arbrain</h1>
    <p>Arrancando tu cerebro artificial…</p>
    <div class="bar" id="bar"></div>
    <div id="error" role="alert">
      <p class="t" id="error-titulo"></p>
      <p class="h" id="error-hacer"></p>
      <details><summary>Ver detalles</summary><pre id="error-detalle"></pre></details>
    </div>
  </div>
  <script>
    // Errores de arranque en lenguaje de alumno (v1.1, A/B del primer arranque): qué pasó y qué hacer, y el texto
    // técnico de la app intacto en «Ver detalles» (para soporte). Sin red ni recursos: solo texto.
    var ERRORES_ARRANQUE = [
      { si: /falta resources\/|no viene en esta app|no trae su servidor/i,
        titulo: 'A esta instalación le faltan piezas',
        hacer: 'Vuelve a descargar Arbrain desde la página del programa e instálalo encima. Tus conversaciones y tu cerebro no se pierden.' },
      { si: /puerto libre/i,
        titulo: 'Tu computadora no tiene un puerto libre para Arbrain',
        hacer: 'Cierra Arbrain, cierra otras apps que hayas abierto para programar y vuelve a abrirlo. Si se repite, reinicia la computadora.' },
      { si: /carpeta de datos|carpeta de la app|permission denied|permiso denegado|read-only|solo lectura|no space|sin espacio/i,
        titulo: 'Arbrain no pudo preparar su carpeta en tu computadora',
        hacer: 'Revisa que tu disco tenga espacio libre y vuelve a abrir Arbrain. Si se repite, reinicia la computadora.' },
      { si: /llavero|keychain|keyring|secret service/i,
        titulo: 'Arbrain no pudo leer el llavero de tu sistema',
        hacer: 'Desbloquea tu sesión o tu llavero y vuelve a abrir Arbrain.' },
      { si: /se cay[oó] \d+ veces|configuraci[oó]n incompleta/i,
        titulo: 'El motor de Arbrain se detuvo varias veces seguidas',
        hacer: 'Cierra Arbrain y vuelve a abrirlo. Si se repite, reinstálalo desde la página del programa y comparte los detalles con soporte.' },
      { si: /did not become ready|no arranc[oó]|no se pudo arrancar|secretos|daemon|servidor web/i,
        titulo: 'Arbrain no terminó de arrancar',
        hacer: 'Cierra Arbrain y vuelve a abrirlo. Si se repite, reinicia la computadora; si sigue, comparte los detalles con soporte.' }
    ]
    function traducirErrorArranque(msg) {
      var texto = String(msg || '')
      for (var i = 0; i < ERRORES_ARRANQUE.length; i++) {
        if (ERRORES_ARRANQUE[i].si.test(texto)) return { titulo: ERRORES_ARRANQUE[i].titulo, hacer: ERRORES_ARRANQUE[i].hacer, detalle: texto }
      }
      return { titulo: 'Algo impidió que Arbrain arrancara', hacer: 'Cierra Arbrain y vuelve a abrirlo. Si se repite, comparte los detalles con soporte.', detalle: texto }
    }
    // Llamado desde Rust si el server local no pudo arrancar
    window.__splashError = function (msg) {
      var t = traducirErrorArranque(msg)
      document.getElementById('error-titulo').textContent = t.titulo
      document.getElementById('error-hacer').textContent = t.hacer
      document.getElementById('error-detalle').textContent = t.detalle
      document.getElementById('error').style.display = 'block'
      var b = document.getElementById('bar')
      if (b) b.style.display = 'none'
      var p = document.querySelector('.wrap > p')
      if (p) p.textContent = 'No pudimos arrancar'
      var l = document.querySelector('.logo')
      if (l) l.style.animation = 'none'
    }
  </script>
</body>
</html>
