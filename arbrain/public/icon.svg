<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep background (only visible at soft corners) -->
  <rect width="512" height="512" rx="80" fill="#050508"/>

  <!-- Glass panel IS the background now — fills the full icon -->
  <rect width="512" height="512" rx="80" fill="url(#glass_fill)" stroke="url(#glass_border)" stroke-width="1.5"/>
  <!-- Glass refraction (top-left light catch) -->
  <rect width="512" height="512" rx="80" fill="url(#glass_refraction)" opacity="0.05"/>
  <!-- Specular highlight (top rim) -->
  <line x1="100" y1="2" x2="412" y2="2" stroke="white" stroke-opacity="0.2" stroke-width="1" stroke-linecap="round"/>
  <!-- Bottom rim (subtle) -->
  <line x1="412" y1="510" x2="100" y2="510" stroke="white" stroke-opacity="0.05" stroke-width="1" stroke-linecap="round"/>

  <!-- Ambient purple bloom -->
  <circle cx="256" cy="264" r="160" fill="url(#ambient_glow)" opacity="0.35"/>

  <!-- Bot glow (soft purple shadow) -->
  <g filter="url(#bot_glow)">
    <g transform="translate(256,264) scale(16)" stroke="#7700EF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5">
      <g transform="translate(-12,-12)">
        <path d="M12 8V4H8"/>
        <rect width="16" height="12" x="4" y="8" rx="2"/>
        <path d="M2 14h2"/>
        <path d="M20 14h2"/>
        <path d="M15 13v2"/>
        <path d="M9 13v2"/>
      </g>
    </g>
  </g>

  <!-- Bot icon (main) -->
  <g transform="translate(256,264) scale(16)" stroke="#7700EF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g transform="translate(-12,-12)">
      <!-- Subtle head fill for depth at small sizes -->
      <rect width="16" height="12" x="4" y="8" rx="2" fill="#7700EF" fill-opacity="0.08" stroke="none"/>
      <!-- Antenna -->
      <path d="M12 8V4H8"/>
      <!-- Head -->
      <rect width="16" height="12" x="4" y="8" rx="2"/>
      <!-- Ears -->
      <path d="M2 14h2"/>
      <path d="M20 14h2"/>
      <!-- Eyes -->
      <path d="M15 13v2"/>
      <path d="M9 13v2"/>
    </g>
  </g>

  <defs>
    <!-- Ambient purple glow -->
    <radialGradient id="ambient_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7700EF"/>
      <stop offset="70%" stop-color="#7700EF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Glass fill: full icon, top-left bright → bottom-right dim -->
    <linearGradient id="glass_fill" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glass border gradient -->
    <linearGradient id="glass_border" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Glass refraction (light from top-left) -->
    <radialGradient id="glass_refraction" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(100 100) rotate(135) scale(400)">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Bot glow filter -->
    <filter id="bot_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
    </filter>
  </defs>
</svg>
