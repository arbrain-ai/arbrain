[package]
name = "arbrain-motor"
version = "0.1.0"
description = "El motor de Arbrain: dueño de las PTYs inmortales (compatible con sfterm-ptyd PROTO 1)"
authors = ["Arbrain"]
edition = "2021"

[lib]
name = "arbrain_motor"
path = "src/lib.rs"

[[bin]]
name = "arbrain-motor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
libc = "0.2"
vt100 = "0.15"
sysinfo = "0.36"
base64 = "0.22"
