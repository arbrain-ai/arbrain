<!doctype html><meta charset="utf-8"><title>panel</title>
<style>
  html, body { margin: 0; height: 100%; font: 14px system-ui }
  [data-panel-derecho] { position: fixed; inset: 0; display: flex; align-items: flex-start; padding: 12px; gap: 4px; background: #efe }
  nav, #fuera-de-tira { display: flex; gap: 4px }
  button { height: 30px; padding: 0 12px }
  .fantasma { position: fixed; left: 0; top: 0; z-index: 99999; pointer-events: none }
  .fantasma > * { display: inline-block; background: #fff; border: 1px solid #333 }
</style>
<div data-panel-derecho><nav data-tira></nav><div id="fuera-de-tira"></div></div>
<script src="panel.js"></script>
