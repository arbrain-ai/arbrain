[package]
name = "arbrain-escritorio"
version = "1.0.0"
description = "Arbrain de escritorio: una ventana nativa para el modo servidor de la edición del alumno"
edition = "2021"
publish = false
license = "UNLICENSED"

[[bin]]
name = "arbrain"
path = "src/main.rs"

[dependencies]
wry = "0.57"
tao = "0.37"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.20"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 4
strip = true
panic = "abort"
