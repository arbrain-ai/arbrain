<!-- Cierre: una sola acción. Si se llevan un prompt o ejercicio, va con botón de copiar. -->
<section class="lamina" data-titulo="Cierre" data-b="Cierre" data-min="10-15" data-pasos="1">
  <div class="centro">
    <div class="kicker rev">Tu siguiente paso</div>
    <h2 class="rev" style="--r:1">Una sola acción, <span class="brillo">hoy.</span></h2>
    <div class="vidrio acento" data-p="1" style="padding:36px 44px;max-width:1500px">
      <div id="dm-prompt" class="sub">Escribe aquí el prompt o ejercicio que se llevan.</div>
      <button data-copia="#dm-prompt" style="margin-top:24px">Copiar</button>
    </div>
  </div>
  <aside class="notas"><p data-p="0">Pide una sola acción concreta.</p><p data-p="1">Ahí está el ejercicio. Cierra y abre preguntas.</p></aside>
</section>
