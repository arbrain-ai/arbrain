<!-- Lámina de una cifra: cambia la materia, descansa el ojo. El CSS anima por paso con .p1, .p2… -->
<section class="lamina" data-titulo="La cifra" data-pasos="1">
  <style>.dm-barra{position:absolute;left:140px;top:640px;height:26px;width:0;border-radius:13px;background:linear-gradient(90deg,var(--acento-2),var(--acento));box-shadow:0 0 40px rgba(var(--acento-rgb),.45);transition:width 1.4s var(--curva)}.p1 .dm-barra{width:1200px}</style>
  <div class="arriba"><div class="kicker rev">Por qué importa</div></div>
  <div class="centro" style="justify-content:flex-start;padding-top:230px;gap:8px">
    <div class="cifra rev">3×</div>
    <div class="sub rev" style="--r:1">mismo esfuerzo, tres veces el resultado.</div>
  </div>
  <div class="dm-barra"></div>
  <aside class="notas"><p data-p="0">Deja que lean el número.</p><p data-p="1">La barra crece: ahí está la diferencia.</p></aside>
</section>
